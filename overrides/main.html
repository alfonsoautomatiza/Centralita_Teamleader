{% extends "base.html" %}

{% block extrahead %}
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url }}">
  <meta property="og:title" content="{{ page.meta.title or config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
  <meta property="og:image" content="https://wertymsd.github.io/Centralita_Teamleader/img-shared/hola.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url }}">
  <meta property="twitter:title" content="{{ page.meta.title or config.site_name }}">
  <meta property="twitter:description" content="{{ page.meta.description or config.site_description }}">
  <meta property="twitter:image" content="https://wertymsd.github.io/Centralita_Teamleader/img-shared/hola.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url }}">

  <!-- Hreflang alternate links -->
  {% if lang == 'es' %}
    <link rel="alternate" hreflang="es" href="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url }}">
    <link rel="alternate" hreflang="en" href="https://wertymsd.github.io/Centralita_Teamleader/en/{{ page.canonical_url }}">
    <link rel="alternate" hreflang="fr" href="https://wertymsd.github.io/Centralita_Teamleader/fr/{{ page.canonical_url }}">
  {% elif lang == 'en' %}
    <link rel="alternate" hreflang="en" href="https://wertymsd.github.io/Centralita_Teamleader/en/{{ page.canonical_url }}">
    <link rel="alternate" hreflang="es" href="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url | replace('en/', '') }}">
    <link rel="alternate" hreflang="fr" href="https://wertymsd.github.io/Centralita_Teamleader/fr/{{ page.canonical_url | replace('en/', '') }}">
  {% elif lang == 'fr' %}
    <link rel="alternate" hreflang="fr" href="https://wertymsd.github.io/Centralita_Teamleader/fr/{{ page.canonical_url }}">
    <link rel="alternate" hreflang="es" href="https://wertymsd.github.io/Centralita_Teamleader/{{ page.canonical_url | replace('fr/', '') }}">
    <link rel="alternate" hreflang="en" href="https://wertymsd.github.io/Centralita_Teamleader/en/{{ page.canonical_url | replace('fr/', '') }}">
  {% endif %}

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Centralita IA Teamleader",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Windows, Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR"
    },
    "description": "{{ page.meta.description or config.site_description }}",
    "author": {
      "@type": "Person",
      "name": "Alfonso Martínez González",
      "url": "https://www.linkedin.com/in/%E2%98%85alfonso-martinez-gonzalez%E2%98%85-19236218/"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "12"
    }
  }
  </script>

  {{ super() }}
{% endblock %}
